name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderflow
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: orderflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - name: Export OpenAPI and assemble the site
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orderflow
          SPRING_DATASOURCE_USERNAME: orderflow
          SPRING_DATASOURCE_PASSWORD: orderflow
          JWT_SECRET: pages-build-secret-at-least-32-bytes-long
        run: |
          set -euo pipefail
          java -jar target/orderflow-api-1.0.0.jar > app.log 2>&1 &
          echo $! > app.pid
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat app.log
            exit 1
          fi
          mkdir -p _site/api
          cp docs/index.html _site/index.html
          cp docs/api/index.html _site/api/index.html
          curl -fsS http://127.0.0.1:8080/v3/api-docs -o _site/api/openapi.json
          python3 -c 'import json; spec=json.load(open("_site/api/openapi.json")); assert "/api/v1/orders" in spec["paths"]'
          kill "$(cat app.pid)" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
